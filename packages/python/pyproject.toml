[project]
name = "pharos-discovery"
version = "1.0.0"
description = "Discovery SDK for MCP servers — search, approve, connect"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Chris Wykel", email = "chris@getpharos.dev" }]
keywords = ["mcp", "model-context-protocol", "discovery", "registry", "ai", "agent"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "anyio>=4.0",
    "httpx>=0.27",
    "pydantic>=2.0",
    "cryptography>=42.0",
    "markdown-it-py>=3.0",
    "mcp>=1.0",
]

[project.urls]
Homepage = "https://discoverpharos.dev"
Repository = "https://github.com/Wpnx330/pharos-discovery"
Documentation = "https://discoverpharos.dev"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "pydantic>=2.0",
]
embeddings = [
    "onnxruntime>=1.17",
    "pharos-discovery-embeddings",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pharos_discovery"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
