[project]
name = "pharos-mcp"
version = "0.1.0"
description = "PHAROS MCP Server + CLI — one-command install for MCP server discovery"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Chris Wykel", email = "chris@getpharos.dev" }]
keywords = ["mcp", "model-context-protocol", "discovery", "registry", "ai", "agent", "pharos"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
]

dependencies = [
    "mcp>=1.0,<2.0",
    "httpx>=0.27",
    "pydantic>=2.0",
    "anyio>=4.0",
]

[project.optional-dependencies]
embeddings = [
    "onnxruntime>=1.17",
]

[project.urls]
Homepage = "https://getpharos.dev"
Repository = "https://github.com/Wpnx330/pharos-discovery"
Documentation = "https://discoverpharos.dev"

[project.scripts]
pharos-mcp = "pharos_mcp.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pharos_mcp"]

[tool.hatch.build.targets.wheel.shared-data]
"binaries/" = "pharos_mcp/binaries/"
